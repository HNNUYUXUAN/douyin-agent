<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>douyin-agent · Evidence walkthrough</title>
<style>
:root{color-scheme:light;--paper:#fff9f0;--ink:#172336;--muted:#5c6676;--blue:#2468ef;--coral:#ff725e;--yellow:#ffe18b;--line:#dfdfdb;--blue-soft:#edf3ff;--coral-soft:#fff0e9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}.app{max-width:1280px;min-height:100vh;margin:auto;padding:24px 32px 18px;display:flex;flex-direction:column;gap:18px}a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:disabled{cursor:default;opacity:.35}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--coral);display:grid;place-items:center;font-size:23px;font-weight:800;color:var(--ink)}.brand strong{display:block;font-size:18px;letter-spacing:.2px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;white-space:nowrap}.tag.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}.tag.pending{background:var(--yellow);border-color:transparent}.top-right{display:flex;align-items:center;gap:10px}.lang{font-size:13px}.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.track button{padding:10px 5px;border:0;border-radius:9px;background:#ebe9e3;color:var(--muted);font-size:13px}.track button[aria-current="step"]{background:var(--ink);color:var(--paper)}.track .n{opacity:.65;margin-right:5px}.stage{flex:1;min-height:535px;display:flex;flex-direction:column;gap:17px}.heading{padding-top:5px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--blue);margin:0 0 8px}.heading h1{font-size:34px;line-height:1.24;letter-spacing:-.6px;margin:0}.heading p{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.65}.content{display:flex;flex-direction:column;gap:14px;flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}.split.wide-left{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px;min-width:0}.card.soft{background:var(--blue-soft);border-color:transparent}.card.warm{background:var(--coral-soft);border-color:transparent}.card h2{font-size:19px;line-height:1.45;margin:10px 0 12px}.card h3{font-size:15px;margin:0 0 10px}.card p{font-size:14px;line-height:1.75;margin:8px 0}.minor{color:var(--muted)}.work-title{min-height:60px}.card .author{font-size:13px;color:var(--muted)}.mono,code{font-family:Consolas,"Cascadia Code",monospace}.id{font-family:Consolas,"Cascadia Code",monospace;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.stat{font-size:34px;font-weight:700;letter-spacing:-.7px;margin:12px 0}.stat small{font-size:13px;font-weight:400;letter-spacing:0;margin-left:5px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.metrics div{border-top:1px solid var(--line);padding-top:12px}.metrics strong{display:block;font-size:23px;font-weight:600}.metrics span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.source-links{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.quote{font-size:25px!important;line-height:1.7!important;margin:15px 0!important;letter-spacing:.1px}.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px}.path span{font-size:12px;padding:6px 9px;background:var(--paper);border-radius:7px}.path .arrow{padding:0;background:none;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:12px}.mini{border-left:4px solid var(--blue);padding:2px 0 2px 14px}.mini strong{font-size:16px}.mini p{font-size:13px;line-height:1.7;margin:5px 0}.callout{padding:13px 17px;background:#eeece5;border-radius:11px;font-size:12px;line-height:1.65;color:var(--muted)}.code-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.code-cell{border:1px solid var(--line);background:#fff;padding:12px;border-radius:10px}.code-cell span{font-size:12px;color:var(--muted)}.code-cell code{display:block;font-size:27px;margin-top:10px;white-space:nowrap}.code-cell.correct{border-color:#b9cef8;background:var(--blue-soft)}.evidence{font-size:12px;color:var(--blue);margin:12px 0 0!important}.equation{white-space:pre-line;font-family:Consolas,"Cascadia Code",monospace;font-size:20px;padding:14px 12px;background:var(--blue-soft);border-radius:10px;margin:14px 0;line-height:1.65}.review-list{padding-left:20px;font-size:14px;line-height:1.75;margin:10px 0}.pending-box{border:1px dashed #c4a54b;background:#fff7d9;border-radius:16px;padding:28px}.pending-box h2{font-size:26px;margin:12px 0}.pending-box p{font-size:15px;line-height:1.8;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th{background:#f1efe8;font-weight:500;color:var(--muted);font-size:12px}th,td{padding:15px 18px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.yes{color:var(--blue);font-weight:600}.retention{display:grid;grid-template-columns:1fr 1fr;gap:15px}.retention .card{padding:17px 20px}.retention h3{font-size:15px}.retention p{font-size:13px;margin-bottom:0}.foot{display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid var(--line);padding-top:13px}.disclosure{font-size:11px;line-height:1.65;color:var(--muted);max-width:850px}.disclosure .en{display:block;margin-top:5px;color:var(--ink);font-size:12px}.controls{display:flex;gap:7px;align-items:center;flex-shrink:0}.controls button{width:37px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink)}.controls .count{font-size:12px;padding:0 7px;color:var(--muted)}.loading{margin:60px auto;font-size:18px;line-height:1.8}body[data-step="0"] .heading h1{font-size:38px}.asset-note{font-size:11px;color:var(--muted);margin:0}
@media(min-width:1000px) and (min-height:760px){.app{height:100vh;gap:14px;padding:20px 28px 14px}.stage{min-height:0;gap:12px}.content{justify-content:center;gap:12px}.card{padding:17px}.card h2{font-size:18px;margin:6px 0 10px}.card p{font-size:13px;line-height:1.6;margin:7px 0}.code-pair{gap:10px;margin-top:9px}.code-cell{padding:9px}.code-cell code{font-size:23px;margin-top:7px}.evidence{font-size:11px;margin:9px 0 0!important}.heading h1{font-size:30px}.heading p{font-size:13px;margin-top:8px}.callout{font-size:11px;padding:10px 14px}}
@media(max-width:760px){.app{padding:18px 16px;gap:16px}.top{align-items:flex-start}.top-right{gap:7px;flex-direction:column;align-items:flex-end}.top .tag{font-size:10px;padding:4px 7px}.brand strong{font-size:15px}.brand span{font-size:10px}.brand-mark{width:30px;height:30px;border-radius:9px}.track{gap:4px}.track button{font-size:11px;padding:9px 2px}.track .n{display:none}.heading h1,body[data-step="0"] .heading h1{font-size:28px;line-height:1.35}.heading p{font-size:13px}.stage{min-height:0}.grid,.split,.split.wide-left,.retention{grid-template-columns:1fr}.card{padding:19px}.card h2{font-size:19px}.work-title{min-height:0}.quote{font-size:21px!important}.metrics strong{font-size:25px}.foot{align-items:flex-start;flex-direction:column}.controls{align-self:flex-end}.disclosure{font-size:11px}.code-cell code{font-size:25px}.equation{font-size:17px}.pending-box{padding:22px}th,td{padding:12px 10px;font-size:12px}.table-wrap{width:100%}.table-wrap table{min-width:520px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">正在读取公开验收摘要…<br><small>请通过本地 HTTP 打开本页面。</small></div></div>
<script>
'use strict';
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
let step=Math.max(0,Math.min(6,Number.parseInt(params.get('step')||'0',10)||0));
const english=params.get('lang')==='en';
let data;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function append(parent,...nodes){nodes.forEach(n=>{if(n)parent.append(n)});return parent;}
function link(text,url){if(!url||!(/^(https:\/\/|cases\/)/.test(url)))return null;const n=el('a','',text);n.href=url;n.target='_blank';n.rel='noopener noreferrer';return n;}
function badge(text,type='blue'){return el('span','tag '+type,text);}
function sourceLinks(c){return append(el('div','source-links'),link('查看原作品 ↗',c.source_url),link('公共证据摘要 ↗',english?c.report_en:c.report_zh),link('证据 JSON ↗',c.evidence_json));}
function card(title,body,cls=''){const n=el('section','card '+cls);if(title)n.append(el('h2','',title));if(body)n.append(el('p','',body));return n;}
function mini(title,body){return append(el('div','mini'),el('strong','',title),el('p','minor',body));}
function metrics(values){const n=el('div','metrics');values.forEach(([v,k])=>n.append(append(el('div'),el('strong','',v),el('span','',k))));return n;}
function codePair(leftLabel,left,rightLabel,right){const row=el('div','code-pair');[[leftLabel,left,''],[rightLabel,right,'correct']].forEach(([label,value,c])=>row.append(append(el('div','code-cell '+c),el('span','',label),el('code','',value))));return row;}
function workCard(c){const n=card(c.title);n.prepend(badge(c.label));n.querySelector('h2').classList.add('work-title');n.append(el('p','author',c.author),el('div','id','作品 ID · '+c.source_id));const v=c.duration_seconds?c.duration_seconds.toFixed(3)+' 秒':c.image_count+' 张图片';n.append(el('div','stat',v),badge('完整性检查通过'));if(c.order_verified)n.append(el('p','minor','数量、原顺序与跨页续接已核对'));n.append(sourceLinks(c));return n;}
function renderTask(){const grid=el('div','split wide-left');const a=card(null,null,'soft');a.append(badge('本轮任务摘要'),el('p','quote',data.task_intent));const p=el('div','path');['浏览器检索','完整性','预览','理解','复核','清理'].forEach((s,i)=>{if(i)p.append(el('span','arrow','→'));p.append(el('span','',s));});a.append(p);const b=card('三种输入，统一交付');append(b,mini('01 · 1–3 分钟短视频','抓住解释步骤、关键数字与画面文字。'),mini('02 · 6–10 分钟长视频','完整音频覆盖，逐段组织证据。'),mini('03 · 5–10 张图文','保持图片原顺序，核对密集代码。'));return append(el('div','content'),append(grid,a,b),el('div','callout','这是一页公开验收结果展示器；页面内容来自可核对的作品与案例记录。'))}
function renderSources(){const grid=el('div','grid');['short','long','note'].forEach(k=>grid.append(workCard(data.cases[k])));return append(el('div','content'),grid,el('div','callout','视频按作品身份、源时长、本地解码和首尾检查核验；图文按数量与原顺序核验。无法完整取得的作品停止该项收费理解。'))}
function renderPreview(){const grid=el('div','grid');['short','long','note'].forEach(k=>{const c=data.cases[k],p=c.preview;const n=card(c.label);n.prepend(badge(c.status==='completed'?'已完成案例':'当前预览',c.status==='completed'?'blue':'pending'));n.append(el('p','minor',c.title),metrics([[p.requests,'请求上限'],[p.images,'图片 / 帧'],[p.audio_seconds.toFixed(3),'音频秒数']]));if(c.actual_submissions)n.append(el('p','minor','实际提交 '+c.actual_submissions.requests+' 次；单独记账。'));else n.append(el('p','minor','尚不把预览上限当成实际消耗。'));grid.append(n)});return append(el('div','content'),grid,el('div','callout','模型：'+data.model+' · 三项实际提交合计 '+data.totals.requests+' 次、'+data.totals.audio_seconds+' 秒音频、'+data.totals.images+' 张图片 / 帧。先预览并取得有效授权；提交量不等于平台结算。'))}
function renderLong(){const c=data.cases.long;const grid=el('div','split');const a=card('代码边界保留原样');a.append(el('p','',c.summary),codePair('课件 · f00072','n == 0','完整演示 · f00080','n <= 0'),el('p','evidence','349.162 秒 / 386.132 秒 · 全局画面位置'),el('p','minor','两处条件分别记录；演示对负值的处理，不等于定义了负数阶乘。'));const b=card('原生时序，纠正推算','', 'soft');b.append(el('p','', 'f00065 的画面位置为 308.084 秒，不能减去 300 秒后冒充 ASR 原生时间。'),el('div','equation','原生 1,640–8,720 ms\n+ 分段偏移 300 s\n= 全局 301.64–308.72 s'),el('p','evidence','语音段 #56 · 服务器原生字段 + 片段偏移'),el('p','minor','画面和语音使用各自的证据；相关错误表述已修订。'));return append(el('div','content'),append(grid,a,b),sourceLinks(c),el('div','callout','已抽查 4 张关键代码 / 公式帧及取得阶段首尾；94 个原生语音段。未逐帧审看、未编译运行代码。'))}
function renderNote(){const c=data.cases.note;const grid=el('div','split');const a=card('ZIP 是后备取得方式','', 'warm');a.append(el('p','',c.acquisition));['公开作品链接','免费解析 ZIP 后备','核对 9 图数量与原顺序','导入并登记任务文件'].forEach((s,i)=>a.append(mini(String(i+1).padStart(2,'0')+' · '+s,'')));a.append(el('p','minor','解析站可用性需现场验证，不是固定依赖。'));const b=card('原图复核，撤回字符误读');c.evidence.forEach(e=>{b.append(codePair('模型误读',e.model_reading,'原图核对',e.reviewed_reading),el('p','evidence',e.position+' · '+e.id),el('p','minor',e.observation));});return append(el('div','content'),append(grid,a,b),sourceLinks(c),el('div','callout','已核对 9 图顺序与跨页续接，抽查 4 张关键页。静态图文使用图片编号，不生成语音时间轴；没有编译运行代码。'))}
function renderShort(){const c=data.cases.short;const grid=el('div','split');const a=workCard(c);a.append(metrics([[c.preview.requests,'请求上限'],[c.preview.images,'采样帧'],[c.preview.audio_seconds.toFixed(3),'音频秒数']]));let b;if(c.status!=='completed'){b=el('section','pending-box');b.append(badge('待完成','pending'),el('h2','','保留真实进度'),el('p','',c.summary),el('p','', '报告、关键证据复核与媒体清理尚未在此快照中确认。'),el('div','callout','已取得 / 已预览 ≠ 已完成理解'))}else{b=card('短视频报告已完成',c.summary,'soft');(c.evidence||[]).slice(0,3).forEach(e=>b.append(mini(e.id+' · '+(e.position||''),e.observation)));b.append(sourceLinks(c));}return append(el('div','content'),append(grid,a,b),el('div','callout','6 张关键原帧与 41 个原生语音段已核对；画面时间与原生 ASR 时间分开记录。转写缺字保留为识别不确定项；它本身不能证明源视频被截断。'))}
function renderCleanup(){const wrap=el('div','table-wrap'),table=el('table'),head=el('thead'),tr=el('tr');['案例','任务状态','登记媒体','文字校验'].forEach(x=>tr.append(el('th','',x)));head.append(tr);table.append(head);const body=el('tbody');['long','note','short'].forEach(k=>{const c=data.cases[k],row=el('tr');row.append(el('td','',c.label),el('td',c.status==='completed'?'yes':'',c.status==='completed'?'completed':'待完成'),el('td','',c.media_retired?'已清理':'暂未确认清理'),el('td','',c.text_validation?'清理后通过':'待验证'));body.append(row)});table.append(body);wrap.append(table);const grid=el('div','retention');grid.append(card('长期保留','Markdown / JSON：报告、原生时序、证据编号与哈希、校验和清理记录。','soft'),card('保护用户原件','仅删除有取得记录与哈希的任务副本；用户原件、环境、源码和私密配置保留。','warm'));return append(el('div','content'),wrap,grid,el('div','callout','云端账本与未决占用不会因删除媒体而消失。已完成文字结果可继续读取；新画面问题需要重新获取素材。'))}
const renderers=[renderTask,renderSources,renderPreview,renderLong,renderNote,renderShort,renderCleanup];
function go(n){step=Math.max(0,Math.min(6,n));const u=new URL(location.href);u.searchParams.set('step',step);history.replaceState(null,'',u);render();}
function render(){app.replaceChildren();document.body.dataset.step=String(step);const current=data.steps[step];const header=el('header','top');const brand=append(el('div','brand'),el('div','brand-mark','d'),append(el('div'),el('strong','',data.title),el('span','','douyin-agent · '+data.subtitle)));const right=append(el('div','top-right'),badge('记录日期 '+data.snapshot_date,''));const lang=el('a','lang',english?'中文说明':'English note');const lu=new URL(location.href);if(english)lu.searchParams.delete('lang');else lu.searchParams.set('lang','en');lang.href=lu;right.append(lang);header.append(brand,right);app.append(header);const nav=el('nav','track');nav.setAttribute('aria-label','验收步骤');data.steps.forEach((s,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-label','第 '+(i+1)+' 屏：'+s.nav);if(i===step)b.setAttribute('aria-current','step');b.append(el('span','n',String(i+1).padStart(2,'0')),document.createTextNode(s.nav));b.onclick=()=>go(i);nav.append(b)});app.append(nav);const stage=el('main','stage');stage.setAttribute('aria-live','polite');const heading=append(el('div','heading'),el('div','eyebrow',current.eyebrow),el('h1','',current.title),el('p','',current.summary));stage.append(heading,renderers[step]());app.append(stage);const footer=el('footer','foot');const text=el('div','disclosure',english?data.disclosure_en:data.disclosure);if(english){text.append(el('span','en',current.english));}const controls=el('div','controls');const prev=el('button','','←');prev.type='button';prev.setAttribute('aria-label','上一屏');prev.disabled=step===0;prev.onclick=()=>go(step-1);const next=el('button','','→');next.type='button';next.setAttribute('aria-label','下一屏');next.disabled=step===6;next.onclick=()=>go(step+1);controls.append(prev,el('span','count',(step+1)+' / 7'),next);footer.append(text,controls);app.append(footer);document.title='douyin-agent · '+current.nav+' · Evidence walkthrough';}
window.addEventListener('keydown',e=>{if(!data||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(step+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(step-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(6)}});
window.addEventListener('popstate',()=>{step=Math.max(0,Math.min(6,Number.parseInt(new URLSearchParams(location.search).get('step')||'0',10)||0));if(data)render()});
fetch('./demo-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()}).then(d=>{if(!d.cases||!Array.isArray(d.steps)||d.steps.length!==7)throw new Error('shape');data=d;render()}).catch(()=>{app.replaceChildren(el('div','loading','未能读取公开摘要。请从本地 HTTP 打开，并确认 demo-data.json 位于同一目录。'));});
</script>
</body>
</html>
